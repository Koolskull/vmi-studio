[package]
name = "vmi-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false
description = "KOOL SKULL STUDIO document, brushes, and vector strokes"

[dependencies]
# WOFF faces in the font catalog unpack with zlib.
flate2 = "1"
# Paper textures and KOSV plates arrive as any picture file, like PIL opens them.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "tga"] }
png = "0.17"
regex = "1"
# Pure Rust TLS for the IPFS and FTPS uploads and the Google Fonts download,
# so every platform builds the same way.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
webpki-roots = "0.26"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

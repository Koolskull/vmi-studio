[package]
name = "vmi-clip-vector"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Read Clip Studio vector strokes out of a .clip file for VMI STUDIO previews"

[[bin]]
name = "vmi-clip-vector"
path = "src/main.rs"

[dependencies]
clipfile = { version = "1.2", features = ["sqlite", "raster"] }
rusqlite = "0.39"
serde_json = "1"
